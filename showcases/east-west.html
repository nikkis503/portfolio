<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where marble meets ink — layered build</title>
<script>document.documentElement.className="js";</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Spectral:wght@200;300;400&family=Noto+Serif+SC:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* ================= ADJUSTMENT PANEL =================
     Every layer is a dial. Change these variables only. */
  :root{
    /* paper */
    --paper-h: 45;            /* hue */
    --paper-s: 12%;           /* saturation */
    --paper-l: 98%;           /* lightness — clean white */
    --grain-opacity:.05;

    /* hand layer */
    --hand-x: 0vw;            /* move right/left */
    --hand-y: 0vh;            /* move down/up */
    --hand-scale: 1;
    --hand-rot: 0deg;
    --hand-opacity: 1;

    /* landscape layer */
    --land-x: 0vw;
    --land-y: 0vh;
    --land-scale: 1;
    --land-opacity: 1;
    --land-contrast: 1.0;

    /* motion */
    --reveal: -8;             /* one sweep: crisp over marble, soft over ink */
    --mist-strength:.8;
    --parallax: 8;            /* px */
  }
  *{box-sizing:border-box;}
  body{margin:0;background:hsl(var(--paper-h) var(--paper-s) var(--paper-l));color:#1c1a15;
    font-family:"Spectral",serif;font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased;}
  .stage{position:relative;width:100vw;height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(120% 95% at 32% 30%,
      hsl(var(--paper-h) calc(var(--paper-s) + 2%) calc(var(--paper-l) + 1%)) 0%,
      hsl(var(--paper-h) var(--paper-s) var(--paper-l)) 55%,
      hsl(var(--paper-h) var(--paper-s) calc(var(--paper-l) - 2%)) 100%);}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;mix-blend-mode:multiply;opacity:var(--grain-opacity);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  .frame{position:relative;width:min(100vw, calc(100svh * 1024/572));height:min(100svh, calc(100vw * 572/1024));}
  .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;will-change:transform;filter:brightness(1.06) saturate(0.92);transition:margin .6s ease;}
  .hand{z-index:3;opacity:var(--hand-opacity);
    transform:translate(var(--hand-x),var(--hand-y)) scale(var(--hand-scale)) rotate(var(--hand-rot));}
  .land{z-index:2;opacity:var(--land-opacity);filter:brightness(1.06) saturate(0.92) contrast(var(--land-contrast));
    transform:translate(var(--land-x),var(--land-y)) scale(var(--land-scale));}
  .art-reveal{position:absolute;inset:0;z-index:2;}
  .js .art-reveal .land{
    -webkit-mask-image:linear-gradient(to right, #000 calc(var(--reveal)*1% - 5%), transparent calc(var(--reveal)*1% + 8%));
            mask-image:linear-gradient(to right, #000 calc(var(--reveal)*1% - 5%), transparent calc(var(--reveal)*1% + 8%));}
  .js .hand{
    -webkit-mask-image:linear-gradient(to right, #000 calc(var(--reveal)*1% - .6%), transparent calc(var(--reveal)*1% + .9%));
            mask-image:linear-gradient(to right, #000 calc(var(--reveal)*1% - .6%), transparent calc(var(--reveal)*1% + .9%));}
  .mist{position:absolute;z-index:4;top:14%;bottom:8%;left:46%;right:-4%;pointer-events:none;opacity:0;
    background:radial-gradient(60% 60% at 55% 52%, hsl(var(--paper-h) var(--paper-s) calc(var(--paper-l) + 4%) / .6), transparent 72%);
    filter:blur(26px);
    animation:mistin 3s ease 2.6s forwards, mistdrift 42s ease-in-out 2.8s infinite;}
  .frame.hold .mist{animation-play-state:paused;}
  .copy{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-52%);max-width:34ch;text-align:center;}
  .copy::before{content:"";position:absolute;inset:-14% -18%;z-index:-1;border-radius:50%;
    background:radial-gradient(60% 60% at 50% 50%, hsl(var(--paper-h) var(--paper-s) var(--paper-l) / .82), transparent 72%);
    filter:blur(10px);}
  .eyebrow{font-family:"Inter",sans-serif;font-size:clamp(.6rem,.72vw,.72rem);letter-spacing:.32em;text-transform:uppercase;color:#3f3b32;opacity:0;animation:rise 1.2s ease 1.4s forwards;}
  .eyebrow .zh{font-family:"Noto Serif SC",serif;} .eyebrow .x{color:#7a4335;margin:0 .4em;}
  h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(2rem,4.6vw,4rem);line-height:1.03;margin:.36em 0 .5em;}
  h1 em{font-style:italic;color:#7a4335;} h1 span{opacity:0;display:inline-block;animation:rise 1.5s ease forwards;}
  h1 .a{animation-delay:1.7s;} h1 .b{animation-delay:1.95s;}
  h1{color:#171510;}
  .sub{font-size:clamp(.9rem,1.15vw,1.08rem);line-height:1.6;color:#43403a;max-width:30ch;margin-left:auto;margin-right:auto;opacity:0;animation:rise 1.6s ease 2.4s forwards;}
  .sub .zh{font-family:"Noto Serif SC",serif;color:#171510;}
  .seal{position:absolute;z-index:6;right:4%;bottom:9%;width:clamp(34px,3.4vw,46px);height:clamp(34px,3.4vw,46px);opacity:0;animation:fade 1.6s ease 3.4s forwards;}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes fade{to{opacity:1;}}
  @keyframes mistin{to{opacity:var(--mist-strength);}}
  @keyframes mistdrift{0%,100%{transform:translateX(-12px);}50%{transform:translateX(24px);}}
  @media (prefers-reduced-motion:reduce){ :root{--reveal:112;} .hand{animation:none;} .mist,.eyebrow,h1 span,.sub,.seal{animation:none;opacity:1;} }
</style></head>

      <div class="eyebrow"><span class="zh">水墨</span><span class="x">×</span>Marmo &nbsp;·&nbsp; the touch of two worlds</div>
      <h1><span class="a">The marble</span> <span class="b">touches <em>the ink.</em></span></h1>
      <p class="sub">One layer of stone, one layer of ink, one sheet of paper — each free to move. <span class="zh">水墨</span> and marble, one gesture.</p>
    </div>
    <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="5" y="5" width="90" height="90" rx="7" fill="none" stroke="#8a3a2e" stroke-width="4.5"/>
      <text x="50" y="40" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" font-size="30" fill="#8a3a2e">之</text>
      <text x="50" y="80" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" font-size="30" fill="#8a3a2e">間</text>
    </svg>

<script>
(function(){
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root=document.documentElement;
  if(!reduce){
    var frame=document.querySelector(".frame");
    var hand=document.getElementById("handL"), land=document.getElementById("landL");
    var showDone=false, hold=false, lastX=null, lastY=null;
    function rest(){ hand.style.marginLeft=hand.style.marginTop="0px"; land.style.marginLeft=land.style.marginTop="0px"; }
    function setHold(on){ if(hold===on) return; hold=on; frame.classList.toggle("hold",on); if(on) rest(); }
    function overFrame(x,y){ var r=frame.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }
    // ink reveal sweeping in from the left
    var start=null, from=parseFloat(getComputedStyle(root).getPropertyValue("--reveal"))|| -8, to=112, dur=3200, begin=450;
    function step(ts){ if(start===null)start=ts; var t=ts-start;
      if(t<begin){ requestAnimationFrame(step); return; }
      var p=Math.min(1,(t-begin)/dur), e=1-Math.pow(1-p,2.3);
      root.style.setProperty("--reveal",(from+(to-from)*e).toFixed(2));
      if(p<1) requestAnimationFrame(step);
      else { showDone=true; if(lastX!==null && overFrame(lastX,lastY)) setHold(true); } }
    requestAnimationFrame(step);
    // pointer over the picture (after the show) => everything holds still; off it => alive again
    var stage=document.getElementById("stage");
    stage.addEventListener("pointermove",function(ev){
      lastX=ev.clientX; lastY=ev.clientY;
      if(showDone && overFrame(ev.clientX,ev.clientY)){ setHold(true); return; }
      setHold(false);
      var px=parseFloat(getComputedStyle(root).getPropertyValue("--parallax"))||8;
      var cx=(ev.clientX/window.innerWidth-.5), cy=(ev.clientY/window.innerHeight-.5);
      hand.style.marginLeft=(cx*px*0.6)+"px"; hand.style.marginTop=(cy*px*0.4)+"px";
      land.style.marginLeft=(cx*-px)+"px";    land.style.marginTop=(cy*-px*0.7)+"px";
    });
    stage.addEventListener("pointerleave",function(){ setHold(false); });
  }
})();
</script>

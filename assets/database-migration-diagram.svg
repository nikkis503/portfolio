<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#181b20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="900" fill="#f4f5f7"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#181b20}.k{font-size:22px;font-weight:600;letter-spacing:2px}.h{font-size:32px;font-weight:600}.b{font-size:26px}.s{font-size:24px;fill:#5b626c}.line{fill:none;stroke:#181b20;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#181b20;stroke-width:3;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}</style><title>Conceptual database migration workflow</title><desc>Oracle data passes through field review informed by departmental KPI reporting needs. Retained fields continue to Databricks; a separate retire branch shows fields not carried forward.</desc><text x="64" y="80" class="k" text-anchor="start">DATABASE MIGRATION</text><rect x="395" y="170" width="410" height="135" rx="12" fill="#fff" stroke="#d6dae0" stroke-width="2"/><text x="600" y="221" class="b" text-anchor="middle">Departmental KPI reports</text><text x="600" y="265" class="s" text-anchor="middle">Reporting needs</text><path d="M600 320 V378" class="flow"/><g><path d="M65 435 V580 C65 615 265 615 265 580 V435" fill="#fff" stroke="#181b20" stroke-width="3"/><ellipse cx="165" cy="435" rx="100" ry="27" fill="#fff" stroke="#181b20" stroke-width="3"/><path d="M65 488 C65 523 265 523 265 488 M65 535 C65 570 265 570 265 535" class="line"/></g><text x="165" y="382" class="h" text-anchor="middle">Oracle</text><g><path d="M935 435 V580 C935 615 1135 615 1135 580 V435" fill="#fff" stroke="#181b20" stroke-width="3"/><ellipse cx="1035" cy="435" rx="100" ry="27" fill="#fff" stroke="#181b20" stroke-width="3"/><path d="M935 488 C935 523 1135 523 1135 488 M935 535 C935 570 1135 570 1135 535" class="line"/></g><text x="1035" y="382" class="h" text-anchor="middle">Databricks</text><path d="M293 495 H441" class="flow"/><rect x="465" y="402" width="270" height="185" rx="12" fill="#181b20"/><text x="600" y="477" text-anchor="middle" style="font-size:34px;font-weight:600;fill:#fff">Field review</text><text x="600" y="525" text-anchor="middle" style="font-size:25px;fill:#d7dbe0">Retain or retire</text><path d="M760 495 H909" class="flow"/><text x="835" y="468" class="s" text-anchor="middle">Retain</text><path d="M600 610 V706" class="flow"/><path d="M566 731 H634" class="line"/><text x="600" y="779" class="b" text-anchor="middle">Retire</text><text x="1035" y="678" class="s" text-anchor="middle">Departmental</text><text x="1035" y="711" class="s" text-anchor="middle">reporting</text></svg>
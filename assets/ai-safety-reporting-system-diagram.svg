<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#181b20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>Conceptual AI safety reporting system workflow</title>
<desc>Image input is processed by a vision language model for image detection and risk classification. A person is assigned to follow up. Follow-up and a closure reason precede closing the case. This is a sector-neutral conceptual workflow, not a client interface.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#181b20}.k{font-size:22px;font-weight:600;letter-spacing:2px}.h{font-size:32px;font-weight:600}.s{font-size:24px;fill:#5b626c}.line{fill:none;stroke:#181b20;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#181b20;stroke-width:3;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="900" fill="#f4f5f7"/>
<text x="64" y="80" class="k">AI SAFETY REPORTING SYSTEM</text>
<!-- Image input and the VLM are the first part of the wider system. -->
<text x="158" y="220" class="h" text-anchor="middle">Image input</text>
<rect x="72" y="264" width="174" height="152" rx="10" fill="#fff" stroke="#181b20" stroke-width="3"/>
<circle cx="210" cy="295" r="13" fill="#d6dbe1"/>
<path d="M88 395 L130 325 L163 365 L190 338 L232 395 Z" fill="#e4e7eb" stroke="#68717d" stroke-width="3" stroke-linejoin="round"/>
<rect x="112" y="310" width="62" height="76" rx="4" fill="none" stroke="#181b20" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M268 340 H310" class="flow"/>
<rect x="334" y="232" width="342" height="216" rx="12" fill="#181b20"/>
<text x="505" y="282" text-anchor="middle" style="font-size:24px;font-weight:600;letter-spacing:2px;fill:#d7dbe0">VLM</text>
<text x="505" y="332" text-anchor="middle" style="font-size:32px;font-weight:600;fill:#fff">Image detection</text>
<text x="505" y="378" text-anchor="middle" style="font-size:32px;font-weight:600;fill:#fff">&amp; risk classification</text>
<path d="M700 340 H820" class="flow"/>
<!-- Assignment is shown without implying automatic assignment. -->
<circle cx="954" cy="297" r="55" fill="#fff" stroke="#181b20" stroke-width="3"/>
<circle cx="954" cy="278" r="15" fill="#181b20"/>
<path d="M925 327 Q925 300 954 300 Q983 300 983 327 Z" fill="#181b20"/>
<text x="954" y="405" class="h" text-anchor="middle">Assign for</text>
<text x="954" y="448" class="h" text-anchor="middle">follow-up</text>
<!-- A continuous connector wraps to the next row. -->
<path d="M954 474 V512 H287 V556" class="flow"/>
<text x="287" y="612" class="h" text-anchor="middle">Follow-up &amp;</text>
<text x="287" y="655" class="h" text-anchor="middle">closure reason</text>
<rect x="177" y="688" width="220" height="120" rx="10" fill="#fff" stroke="#181b20" stroke-width="3"/>
<path d="M210 722 H364 M210 748 H364 M210 774 H308" stroke="#acb3bd" stroke-width="7" stroke-linecap="round"/>
<path d="M422 748 H843" class="flow"/>
<circle cx="954" cy="738" r="62" fill="#fff" stroke="#181b20" stroke-width="3"/>
<path d="M924 739 L945 760 L986 715" class="line" style="stroke-width:7"/>
<text x="954" y="854" class="h" text-anchor="middle">Close case</text>
</svg>
